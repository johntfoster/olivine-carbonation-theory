name: Build MOOSE base image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Make room for MOOSE
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: .devcontainer/Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: olivine-base:candidate
          cache-from: type=gha,scope=olivine-base
          cache-to: type=gha,scope=olivine-base,mode=max
      - name: Verify compiled framework and scientific Python
        run: |
          docker run --rm olivine-base:candidate with-moose /opt/moose/test/moose_test-opt --help
          docker run --rm olivine-base:candidate with-moose python -c 'import numpy, scipy, pandas, matplotlib'
      - name: Publish tested base
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag olivine-base:candidate "$IMAGE:base-$REVISION"
          docker tag olivine-base:candidate "$IMAGE:base-current"
          docker push "$IMAGE:base-$REVISION"
          docker push "$IMAGE:base-current"
          docker inspect "$IMAGE:base-current" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
